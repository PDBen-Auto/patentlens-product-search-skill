name: Validate PatentLens Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate package and synthetic boundary
        run: node tests/structure.mjs
      - name: Test search engine and report escaping
        run: node tests/smoke.mjs
